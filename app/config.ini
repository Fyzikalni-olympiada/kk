[common]
; PHP configuration
php.date.timezone = "Europe/Prague"
php.iconv.internal_encoding = "%encoding%"
php.mbstring.internal_encoding = "%encoding%"

; debug
debug.enable = TRUE
; 194    honza práce
; 78     lukas - kolej
debug.mode = "194.213.62.154,78.128.193.114"
debug.email = jan@prachar.eu
debug.strictMode = FALSE

; vars
variable.site = KK FO
variable.lang = cs
variable.tempDir = %appDir%/../temp
variable.logDir = %appDir%/../log
variable.mailFrom = webmaster@fyzikalniolympiada.cz
variable.mailReturnPath = webmaster@fyzikalniolympiada.cz
variable.facebookAppId =
variable.facebookSecret =
variable.allowRobots = TRUE
variable.rocnik = 58

; services
service.Nette-Application-Application = Eywa\Application

service.Nette-Security-IAuthenticator.factory = Eywa\Security\CouchDBAuthenticator
service.Nette-Security-IAuthorizator  = Nette\Security\Permission

service.Nette-Application-IPresenterLoader.factory = Eywa\PresenterLoader

service.Nette-Loaders-RobotLoader.option.directory[] = %appDir%
service.Nette-Loaders-RobotLoader.option.directory[] = %libsDir%
service.Nette-Loaders-RobotLoader.run = TRUE

service.Eywa-CMS-Repository.factory = 'Eywa\CMS\Repository'

service.Eywa-CMS-Repository-IStorage.factory = 'Eywa\CMS\Repository\Storage\CouchDB'
service.Eywa-CMS-Repository-IStorage.option.database = kkfo

service.Eywa-Application-IFileLoaderFactory.factory = 'Eywa\CMS\Application\FileLoaderFactory'

[common.variable.tinyMCE]
extended_valid_elements = 'b/strong,i/em,div[id|class|title]'

[production < common]
; common database connection
service.Eywa-CMS-Repository-IStorage.option.host = localhost
mail.defaultMailer = Nette\Mail\SendmailMailer

[beta < production]
mode.production = TRUE
variable.allowRobots = FALSE

[development < beta]
mode.production = FALSE
mail.defaultMailer = Eywa\Mail\TestMailer
service.Eywa-CMS-Repository-IStorage.option.profiler = TRUE

[home < development]

[console < development]
